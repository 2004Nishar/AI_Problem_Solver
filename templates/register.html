<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NSC AI Problem | Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-[#01041c] to-[#0c001f] text-gray-200 min-h-screen flex items-center justify-center p-5 relative overflow-hidden">
  <div id="particles-js" class="absolute inset-0 z-0"></div>

  <div class="relative z-10 w-full max-w-md bg-[rgba(10,10,30,0.85)] border border-purple-600/40 rounded-xl p-8 backdrop-blur-md shadow-2xl animate-fade-in">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-200 tracking-wide mb-1">Create Your Account</h1>
      <p class="font-mono text-sm text-cyan-400">Join the Api Problem Solver</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST" id="registerForm" novalidate class="space-y-6">
      <!-- Full Name -->
      <div>
        <label for="fullName" class="block text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Full Name</label>
        <input id="fullName" type="text" placeholder="e.g., Alex Ryder" required class="w-full p-3 bg-transparent border border-purple-600/40 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-600/30" />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Email Address</label>
        <input id="email" type="email" placeholder="you@example.com" required class="w-full p-3 bg-transparent border border-purple-600/40 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-600/30" />
      </div>

      <!-- API Key -->
      <div>
        <label for="apiKey" class="block text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">API Key</label>
        <input id="apiKey" type="text" placeholder="Enter Your API Key" required class="w-full p-3 bg-transparent border border-purple-600/40 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-600/30" />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Password</label>
        <div class="relative">
          <input id="password" type="password" placeholder="Enter a secure password" required class="w-full p-3 pr-10 bg-transparent border border-purple-600/40 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-600/30" />
          <button type="button" id="togglePassword" class="absolute inset-y-0 right-3 flex items-center text-gray-400 text-lg">👁️</button>
        </div>
        <div id="passwordStrength" class="mt-2 text-xs font-mono h-4"></div>
      </div>

      <!-- Submit -->
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-400 to-purple-600 text-white rounded-lg font-bold uppercase tracking-wider hover:-translate-y-1 hover:shadow-xl transition">Register</button>
    </form>

    <!-- Link to Login -->
    <div class="text-center mt-6 text-sm">
      <p>Generate <a href="https://aistudio.google.com/apikey" target="_blank" class="text-cyan-400 font-bold hover:text-purple-400 underline">Key</a></p>
      <p>Already have an account? <a href="{{ url_for('login') }}" class="text-cyan-400 font-bold hover:text-purple-400 underline">Log In</a></p>
    </div>
  </div>

  <!-- Particles -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      particles: {
        number: { value: 60, density: { enable: true, value_area: 800 } },
        color: { value: "#8a2be2" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 2, random: true },
        line_linked: { enable: true, distance: 150, color: "#00bfff", opacity: 0.2, width: 1 },
        move: { enable: true, speed: 1, direction: "none", straight: false }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100, duration: 0.4 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });

    const form = document.getElementById('registerForm');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const strengthDiv = document.getElementById('passwordStrength');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
    });

    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[a-z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;

      strengthDiv.className = 'mt-2 text-xs font-mono h-4';
      if (password.length === 0) {
        strengthDiv.textContent = '';
      } else if (strength <= 2) {
        strengthDiv.textContent = 'Security: Weak';
        strengthDiv.classList.add('text-red-500');
      } else if (strength <= 4) {
        strengthDiv.textContent = 'Security: Medium';
        strengthDiv.classList.add('text-yellow-400');
      } else {
        strengthDiv.textContent = 'Security: Strong';
        strengthDiv.classList.add('text-green-400');
      }
    });
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const registerForm = document.getElementById("registerForm");

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();
      const password = document.getElementById("password").value.trim();
      const submitBtn = registerForm.querySelector("button");

      // Disable button while submitting
      submitBtn.disabled = true;

      // Basic validation
      if (!fullName || !email || !apiKey || !password) {
        alert("Please fill in all fields.");
        submitBtn.disabled = false;
        return;
      }

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ fullName, email, apiKey, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert("Registration successful!");
          window.location.href = "/login";
        } else {
          alert(data.error || "Registration failed.");
          submitBtn.disabled = false;
        }
      } catch (error) {
        console.error("Error during registration:", error);
        alert("An unexpected error occurred.");
        submitBtn.disabled = false;
      }
    });
  });
</script>

</body>
</html>
