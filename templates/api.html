<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Prompt</title>
  <style>
    body {
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    #customPromptOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #customPrompt {
      background: #121212;
      border: 2px solid #0ff;
      box-shadow: 0 0 20px #0ff;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    #customPrompt input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      outline: none;
      margin-top: 10px;
      background: #1f1f1f;
      color: #0ff;
    }

    #customPrompt button {
      margin-top: 20px;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #0ff;
      color: black;
      box-shadow: 0 0 10px #0ff;
    }

    #customPrompt h3 {
      margin-bottom: 10px;
      color: #0ff;
    }
  </style>
</head>
<body>

<button id="changeTopicBtn">Change Topic</button>

<!-- Custom Prompt Modal -->
<div id="customPromptOverlay">
  <div id="customPrompt">
    <h3>📝 Enter a new Python topic:</h3>
    <input type="text" id="topicInput" placeholder="e.g., recursion, OOP..." />
    <button onclick="submitPrompt()">Submit</button>
  </div>
</div>

<script>
  let selectedTopic = "default";

  document.getElementById("changeTopicBtn").addEventListener("click", () => {
    document.getElementById("customPromptOverlay").style.display = "flex";
    document.getElementById("topicInput").value = selectedTopic || "";
    document.getElementById("topicInput").focus();
  });

  function submitPrompt() {
    const input = document.getElementById("topicInput").value.trim();
    if (input) {
      selectedTopic = input;
      generateProblem(selectedTopic);
    }
    document.getElementById("customPromptOverlay").style.display = "none";
  }

  // Optional: Close modal when clicking outside the box
  document.getElementById("customPromptOverlay").addEventListener("click", (e) => {
    if (e.target === document.getElementById("customPromptOverlay")) {
      document.getElementById("customPromptOverlay").style.display = "none";
    }
  });

  function generateProblem(topic) {
    alert("✅ Problem will be generated for topic: " + topic);
    // Add your logic here
  }
</script>

</body>
</html>
